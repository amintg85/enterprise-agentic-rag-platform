spring:
  application:
    name: enterprise-agentic-rag-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
    username: ${SPRING_DATASOURCE_USERNAME:enterprise}
    password: ${SPRING_DATASOURCE_PASSWORD:enterprise}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration-minutes: 30
  ai:
    provider: ${AI_PROVIDER:openai}
    openai-api-key: ${OPENAI_API_KEY:}
